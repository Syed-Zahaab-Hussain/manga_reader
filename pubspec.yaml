name: manga_reader
description: "A manga and comic reader app for locally stored files."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Secure storage (PIN)
  flutter_secure_storage: ^9.2.2

  # Biometric authentication
  local_auth: ^2.3.0

  # File/folder picker
  file_picker: ^8.1.7

  # Archive (ZIP/CBZ)
  archive: ^4.0.4

  # Image caching
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Shared preferences (settings)
  shared_preferences: ^2.3.3

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.4

  # Permission handling
  permission_handler: ^11.3.1

  # Natural sort is implemented inline in the scanner service (pure Dart)

  # Pinch-to-zoom
  photo_view: ^0.15.0

  # Index-based scroll list (for accurate page jumping)
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
